name: MyST and Quarto Deploy
concurrency:
  group: 'pages'
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build:
    # No `environment:` binding here - that's what let PRs actually validate
    # a build. The `github-pages` environment's protection rules reject any
    # non-main ref from entering a job bound to it, which used to block the
    # whole job (including these harmless build-only steps) on every PR.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Table of Contents in README
        if: ${{ github.event_name == 'push' }}
        run: |
          deploy_date=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M')
          echo -e "\n*Last Deployed: $deploy_date EST*\n" > toc.tmp
          echo -e "## Deployed Presentations\n" >> toc.tmp
          if [[ -d slides ]]; then
            find slides -type f \( -name "*.md" -o -name "*.qmd" \) | sort | while read -r file; do
              if grep -q "^deploy:[[:space:]]*true" "$file"; then
                relpath="${file#slides/}"
                relpath="${relpath%.md}"
                relpath="${relpath%.qmd}"
                title=$(grep -m 1 "^description:[[:space:]]*" "$file" | sed 's/^description:[[:space:]]*//' | sed 's/^"//;s/"$//' | sed "s/^'//;s/'$//" | tr -d '\r')
                if [ -z "$title" ]; then
                  title=$(grep -m 1 "^title:[[:space:]]*" "$file" | sed 's/^title:[[:space:]]*//' | sed 's/^"//;s/"$//' | tr -d '\r')
                fi
                if [ -z "$title" ]; then
                  title=$(grep -m 1 "^# " "$file" | sed 's/^# //' | tr -d '\r' || echo "$relpath")
                fi
                edit_date=$(TZ='America/New_York' git log -1 --format="%cd" --date=format:"%Y-%m-%d %H:%M" -- "$file")
                if [ -z "$edit_date" ]; then edit_date="Unknown"; fi
                echo "- [$title](https://jhconning.github.io/hunter_eco701/slides/${relpath}.html) ([PDF](https://jhconning.github.io/hunter_eco701/slides/${relpath}.pdf)) *(Last edit: $edit_date)*" >> toc.tmp
              fi
            done
          fi
          awk '/<!-- TOC_START -->/{p=1; print; system("cat toc.tmp"); next} /<!-- TOC_END -->/{p=0} !p' README.md > README.new
          mv README.new README.md

      - name: Commit and Push README
        if: ${{ github.event_name == 'push' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Table of Contents [skip ci]" && git push)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build MyST Site
        env:
          BASE_URL: '/hunter_eco701'
        run: myst build --html

      - name: Prepare Slides Directory
        run: mkdir -p _build/html/slides

      - name: Copy topic media folders to build
        run: |
          # Each topic folder (slides/<topic>/media/) gets mirrored into the build output
          # at the same relative path. Nested raw/media/ folders are intentionally excluded -
          # those are extraction intermediates, not deployable assets. Needed regardless of
          # slide engine: Quarto (like marp-cli before it) doesn't copy statically-referenced
          # images (![](media/x.png)) into its own output - only content it generates itself
          # at render time.
          find slides -mindepth 2 -maxdepth 2 -type d -name media | while read -r dir; do
            dest="_build/html/${dir}"
            mkdir -p "$dest"
            cp -R "$dir"/. "$dest"/
          done

      - name: Check if slides folder exists
        id: slides-folder-exists
        run: bash -c "[[ -d slides ]] ; echo \"has_slides=\$?\" >> \"$GITHUB_OUTPUT\""

      # --- Quarto decks (the current, canonical format - see HANDOFF.md) ---

      - name: Setup Python for executable code cells
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps and register the ecopy kernel
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        run: |
          # Package list matches what's actually used by executable cells in
          # deck.qmd files as of this writing - extend as new topics need more.
          # Registered under the name "ecopy" so it matches `jupyter: ecopy`
          # in every deck.qmd's YAML unchanged from local development.
          pip install jupyter ipykernel plotly sympy matplotlib numpy pandas
          python -m ipykernel install --user --name ecopy

      - name: Setup Quarto
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Quarto Render + PDF Export
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        run: |
          # Renders each deck.qmd in place (Quarto's natural mode - relative
          # media/ references resolve against the source file's own
          # directory), decktapes the result to a parallel PDF (Quarto has
          # no built-in revealjs PDF export - see HANDOFF.md), copies both
          # into the build output, then cleans up the in-place render
          # artifacts so they don't pollute the checkout.
          find slides -mindepth 2 -maxdepth 2 -type f -name "deck.qmd" | sort | while read -r qmd; do
            topic_dir=$(dirname "$qmd")
            echo "Rendering ${qmd}"
            quarto render "$qmd"

            dest="_build/html/${topic_dir}"
            mkdir -p "$dest"
            cp "${topic_dir}/deck.html" "${dest}/deck.html"
            if [ -d "${topic_dir}/deck_files" ]; then
              cp -R "${topic_dir}/deck_files" "${dest}/deck_files"
            fi

            echo "Exporting PDF for ${qmd} via decktape"
            npx -y decktape reveal --size "1280x720" "${topic_dir}/deck.html" "${dest}/deck.pdf"

            rm -f "${topic_dir}/deck.html"
            rm -rf "${topic_dir}/deck_files"
          done

      # --- Legacy Marp decks (any topic not yet migrated - see HANDOFF.md) ---

      - name: Marp Build HTML
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: docker://marpteam/marp-cli:v4.2.3
        with:
          args: -I slides/ -o _build/html/slides/ --theme-set slides/_shared/eco701-theme.css
        env:
          MARP_USER: root:root

      - name: Marp Build PDFs
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: docker://marpteam/marp-cli:v4.2.3
        with:
          args: -I slides/ -o _build/html/slides/ --pdf --allow-local-files --theme-set slides/_shared/eco701-theme.css
        env:
          MARP_USER: root:root

      - name: Setup Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
