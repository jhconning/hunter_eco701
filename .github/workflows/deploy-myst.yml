name: MyST and Quarto Deploy
concurrency:
  group: 'pages'
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build:
    # No `environment:` binding here - that's what let PRs actually validate
    # a build. The `github-pages` environment's protection rules reject any
    # non-main ref from entering a job bound to it, which used to block the
    # whole job (including these harmless build-only steps) on every PR.
    runs-on: ubuntu-latest
    env:
      # Master switch for the whole slide half of the build. 'false' ships
      # only the front page and the reading schedule, whatever the decks say.
      # With it on, WHICH decks publish is decided per deck by `deploy: true`
      # in that deck's own YAML - see the "Select decks to publish" step.
      PUBLISH_SLIDES: 'true'
      # Public origin of the deployed site. Used to repair the localhost URLs
      # that MyST bakes into its prerendered output - see the rewrite step.
      SITE_URL: 'https://jhconning.github.io/hunter_eco701'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Table of Contents in README
        if: ${{ github.event_name == 'push' && env.PUBLISH_SLIDES == 'true' }}
        run: |
          deploy_date=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M')
          echo -e "\n*Last Deployed: $deploy_date EST*\n" > toc.tmp
          echo -e "## Deployed Presentations\n" >> toc.tmp
          if [[ -d slides ]]; then
            find slides -type f \( -name "*.md" -o -name "*.qmd" \) | sort | while read -r file; do
              if grep -q "^deploy:[[:space:]]*true" "$file"; then
                relpath="${file#slides/}"
                relpath="${relpath%.md}"
                relpath="${relpath%.qmd}"
                title=$(grep -m 1 "^description:[[:space:]]*" "$file" | sed 's/^description:[[:space:]]*//' | sed 's/^"//;s/"$//' | sed "s/^'//;s/'$//" | tr -d '\r')
                if [ -z "$title" ]; then
                  title=$(grep -m 1 "^title:[[:space:]]*" "$file" | sed 's/^title:[[:space:]]*//' | sed 's/^"//;s/"$//' | tr -d '\r')
                fi
                if [ -z "$title" ]; then
                  title=$(grep -m 1 "^# " "$file" | sed 's/^# //' | tr -d '\r' || echo "$relpath")
                fi
                edit_date=$(TZ='America/New_York' git log -1 --format="%cd" --date=format:"%Y-%m-%d %H:%M" -- "$file")
                if [ -z "$edit_date" ]; then edit_date="Unknown"; fi
                echo "- [$title](https://jhconning.github.io/hunter_eco701/slides/${relpath}.html) ([PDF](https://jhconning.github.io/hunter_eco701/slides/${relpath}.pdf)) *(Last edit: $edit_date)*" >> toc.tmp
              fi
            done
          fi
          awk '/<!-- TOC_START -->/{p=1; print; system("cat toc.tmp"); next} /<!-- TOC_END -->/{p=0} !p' README.md > README.new
          mv README.new README.md

      - name: Commit and Push README
        if: ${{ github.event_name == 'push' && env.PUBLISH_SLIDES == 'true' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Table of Contents [skip ci]" && git push)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build MyST Site
        env:
          BASE_URL: '/hunter_eco701'
        run: myst build --html

      - name: Rewrite the prerender origin in the build output
        run: |
          # `myst build --html` prerenders by fetching pages from a local
          # server it starts itself, so every absolute URL it bakes in points
          # at http://localhost:3000 - the <loc> entries and stylesheet href
          # in sitemap.xml, the Sitemap: line in robots.txt, and og:url on
          # each page. MyST 1.10.1's book-theme derives that origin from the
          # request URL alone (Jse() in the theme bundle) with no config hook,
          # so myst.yml cannot set it and rewriting afterwards is the fix.
          #
          # Restricted to the text formats that carry it; the JS bundles are
          # left alone.
          find _build/html -type f \( -name "*.html" -o -name "*.xml" -o -name "*.txt" \) -exec sed -i "s#http://localhost:3000#${SITE_URL}#g" {} +
          echo "Remaining localhost references: $(grep -rl 'localhost:3000' _build/html --include='*.html' --include='*.xml' --include='*.txt' | wc -l)"

      - name: Prepare Slides and Syllabus Directories
        if: env.PUBLISH_SLIDES == 'true'
        run: |
          mkdir -p _build/html/slides
          if [ -d syllabus ]; then
            mkdir -p _build/html/syllabus
            cp -r syllabus/*.pdf _build/html/syllabus/ 2>/dev/null || true
          fi

      - name: Select decks to publish
        if: env.PUBLISH_SLIDES == 'true'
        run: |
          # A deck reaches the site only if its own YAML carries `deploy: true`.
          # `deploy: false`, or no deploy line at all, means draft: not rendered,
          # not exported to PDF, media not copied, not listed in the README. This
          # is the same test the README index step uses, so the index and the
          # published site cannot drift apart.
          #
          # The list is written to the runner's temp dir (not the workspace) so
          # it can never be swept into the build output or a commit.
          list="${RUNNER_TEMP}/published_decks.txt"
          : > "$list"
          find slides -mindepth 2 -maxdepth 2 -type f \( -name "deck.qmd" -o -name "deck.md" \) |
            sort | while read -r deck; do
              if grep -q "^deploy:[[:space:]]*true" "$deck"; then
                echo "$deck" >> "$list"
                echo "publish   $deck"
              else
                echo "hold back $deck  (draft - no 'deploy: true')"
              fi
            done
          echo "DECK_LIST=${list}" >> "$GITHUB_ENV"
          echo "Publishing $(wc -l < "$list") deck(s)."

      - name: Copy media folders for published decks
        if: env.PUBLISH_SLIDES == 'true'
        run: |
          # Each published topic's media/ gets mirrored into the build output at
          # the same relative path. Nested raw/media/ folders are intentionally
          # excluded - those are extraction intermediates, not deployable assets.
          # Needed regardless of slide engine: Quarto (like marp-cli before it)
          # doesn't copy statically-referenced images (![](media/x.png)) into its
          # own output - only content it generates itself at render time. Drafts
          # are skipped here too, so an unreleased deck's figures never reach the
          # public site even though nothing links to them.
          while read -r deck; do
            topic_dir=$(dirname "$deck")
            [ -d "${topic_dir}/media" ] || continue
            dest="_build/html/${topic_dir}/media"
            mkdir -p "$dest"
            cp -R "${topic_dir}/media"/. "$dest"/
          done < "$DECK_LIST"

      # has_slides=0 means "build the slides" (it began life as an exit status).
      # It is now gated on PUBLISH_SLIDES and on at least one deck having opted
      # in, so both the master switch and an all-drafts state turn off every
      # slide step that follows.
      - name: Check whether to build slides
        id: slides-folder-exists
        run: |
          if [[ "${PUBLISH_SLIDES}" == "true" && -s "${DECK_LIST:-/nonexistent}" ]]; then
            echo "has_slides=0" >> "$GITHUB_OUTPUT"
          else
            echo "has_slides=1" >> "$GITHUB_OUTPUT"
            echo "Slide rendering skipped (PUBLISH_SLIDES=${PUBLISH_SLIDES}, no deck marked 'deploy: true')."
          fi

      # --- Quarto decks (the current, canonical format - see HANDOFF.md) ---

      - name: Setup Python for executable code cells
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps and register the ecopy kernel
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        run: |
          # Package list matches what's actually used by executable cells in
          # deck.qmd files as of this writing - extend as new topics need more.
          # Registered under the name "ecopy" so it matches `jupyter: ecopy`
          # in every deck.qmd's YAML unchanged from local development.
          pip install jupyter ipykernel plotly sympy matplotlib numpy pandas
          python -m ipykernel install --user --name ecopy

      - name: Setup Quarto
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Quarto Render + PDF Export
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        run: |
          # Renders each deck.qmd in place (Quarto's natural mode - relative
          # media/ references resolve against the source file's own
          # directory), decktapes the result to a parallel PDF (Quarto has
          # no built-in revealjs PDF export - see HANDOFF.md), copies both
          # into the build output, then cleans up the in-place render
          # artifacts so they don't pollute the checkout.
          grep -E '\.qmd$' "$DECK_LIST" | while read -r qmd; do
            topic_dir=$(dirname "$qmd")
            echo "Rendering ${qmd}"
            quarto render "$qmd"

            dest="_build/html/${topic_dir}"
            mkdir -p "$dest"
            cp "${topic_dir}/deck.html" "${dest}/deck.html"
            if [ -d "${topic_dir}/deck_files" ]; then
              cp -R "${topic_dir}/deck_files" "${dest}/deck_files"
            fi

            echo "Exporting PDF for ${qmd} via decktape"
            # --no-sandbox: this runner's container has no working setuid
            # sandbox helper for Chromium (a standard constraint on hosted
            # CI, unrelated to this project) - without it decktape's bundled
            # Chrome aborts at launch ("No usable sandbox!").
            npx -y decktape reveal --size "1280x720" --chrome-arg="--no-sandbox" "${topic_dir}/deck.html" "${dest}/deck.pdf"

            rm -f "${topic_dir}/deck.html"
            rm -rf "${topic_dir}/deck_files"
          done

      # --- Legacy Marp decks (any topic not yet migrated - see HANDOFF.md) ---

      - name: Stage published Marp decks
        id: stage-marp
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        run: |
          # marp-cli only takes an input DIRECTORY here, and it converts every
          # .md it finds under it - which would publish each topic's
          # new_ideas.md backlog alongside the deck, and would ignore
          # `deploy:` entirely. Staging just the decks that opted in keeps both
          # drafts and working notes off the site while leaving marp's own
          # invocation unchanged.
          rm -rf _stage
          count=0
          while read -r deck; do
            case "$deck" in *.md) ;; *) continue ;; esac
            topic_dir=$(dirname "$deck")
            mkdir -p "_stage/${topic_dir}"
            cp "$deck" "_stage/${topic_dir}/"
            if [ -d "${topic_dir}/media" ]; then
              cp -R "${topic_dir}/media" "_stage/${topic_dir}/media"
            fi
            count=$((count + 1))
            echo "staged $deck"
          done < "$DECK_LIST"
          echo "has_marp=${count}" >> "$GITHUB_OUTPUT"
          echo "Staged ${count} Marp deck(s)."

      - name: Marp Build HTML
        if: steps.slides-folder-exists.outputs.has_slides == '0' && steps.stage-marp.outputs.has_marp != '0'
        uses: docker://marpteam/marp-cli:v4.2.3
        with:
          args: -I _stage/slides/ -o _build/html/slides/ --theme-set slides/_shared/eco701-theme.css
        env:
          MARP_USER: root:root

      - name: Marp Build PDFs
        if: steps.slides-folder-exists.outputs.has_slides == '0' && steps.stage-marp.outputs.has_marp != '0'
        uses: docker://marpteam/marp-cli:v4.2.3
        with:
          args: -I _stage/slides/ -o _build/html/slides/ --pdf --allow-local-files --theme-set slides/_shared/eco701-theme.css
        env:
          MARP_USER: root:root

      - name: Setup Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
