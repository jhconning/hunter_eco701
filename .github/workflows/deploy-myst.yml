name: MyST and Marp Deploy
concurrency:
  group: 'pages'
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Table of Contents in README
        run: |
          deploy_date=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M')
          echo -e "\n*Last Deployed: $deploy_date EST*\n" > toc.tmp
          echo -e "## Deployed Presentations\n" >> toc.tmp
          if [[ -d slides ]]; then
            find slides -type f -name "*.md" | sort | while read -r file; do
              if grep -q "^deploy:[[:space:]]*true" "$file"; then
                filename=$(basename "$file")
                title=$(grep -m 1 "^description:[[:space:]]*" "$file" | sed 's/^description:[[:space:]]*//' | sed 's/^"//;s/"$//' | sed "s/^'//;s/'$//" | tr -d '\r')
                if [ -z "$title" ]; then
                  title=$(grep -m 1 "^# " "$file" | sed 's/^# //' | tr -d '\r' || echo "${filename%.md}")
                fi
                edit_date=$(TZ='America/New_York' git log -1 --format="%cd" --date=format:"%Y-%m-%d %H:%M" -- "$file")
                if [ -z "$edit_date" ]; then edit_date="Unknown"; fi
                echo "- [$title](https://jhconning.github.io/hunter_eco701/slides/${filename%.md}.html) ([PDF](https://jhconning.github.io/hunter_eco701/slides/${filename%.md}.pdf)) *(Last edit: $edit_date)*" >> toc.tmp
              fi
            done
          fi
          awk '/<!-- TOC_START -->/{p=1; print; system("cat toc.tmp"); next} /<!-- TOC_END -->/{p=0} !p' README.md > README.new
          mv README.new README.md

      - name: Commit and Push README
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Table of Contents [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build MyST Site
        env:
          BASE_URL: '/hunter_eco701'
        run: myst build --html

      - name: Prepare Marp Directory
        run: mkdir -p _build/html/slides

      - name: Copy slide attachments to build
        run: |
          if [[ -d slides/attachments ]]; then cp -R slides/attachments _build/html/slides/attachments; fi
          if [[ -d slides/themes ]]; then cp -R slides/themes _build/html/slides/themes; fi

      - name: Check if slides folder exists
        id: slides-folder-exists
        run: bash -c "[[ -d slides ]] ; echo \"has_slides=\$?\" >> \"$GITHUB_OUTPUT\""

      - name: Marp Build HTML
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: docker://marpteam/marp-cli:v3.0.2
        with:
          args: -I slides/ -o _build/html/slides/ --theme-set slides/themes/neobeam.css
        env:
          MARP_USER: root:root

      - name: Marp Build PDFs
        if: steps.slides-folder-exists.outputs.has_slides == '0'
        uses: docker://marpteam/marp-cli:v3.0.2
        with:
          args: -I slides/ -o _build/html/slides/ --pdf --allow-local-files --theme-set slides/themes/neobeam.css
        env:
          MARP_USER: root:root

      - name: Upload artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name == 'push' }}
        id: deployment
        uses: actions/deploy-pages@v4
