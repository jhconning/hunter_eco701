  conflicting, not just coordination, interest over multiple equilibria -
  not duplicated anywhere else in the course) was salvaged into Topic 1 as
  well on 2026-07-19, right after its Palanpur assurance-game slide - see
  slides/01_definitions-and-key-tools/source.yml for that side of the
  provenance. Moved from slides/ to docs/archive/ so the CI build (which
  scans slides/ wholesale) never touches it; deck.md's deploy flag also
