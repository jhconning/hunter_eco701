notes: >
  ARCHIVED 2026-07-19: Topic 8's lecture slot was dissolved 2026-07-18 once
  Topic 1's BFH-based rework absorbed essentially all of this deck's core
  content. Nash bio text already cannibalized into Topic 1 on 2026-07-18;
