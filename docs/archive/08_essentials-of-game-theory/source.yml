  original, unedited history of this deck while it was still live.


  Pilot conversion, redesigned and approved 2026-07-13. Covers formal Nash
  equilibrium / best-response definitions and three worked games (Prisoner's
  Dilemma, Opera/Football coordination game, Fisherman's Dilemma). Original
  slides 1-9 (course logistics) were split out into ../00_logistics/ instead,
  since they aren't part of the 11-topic sequence in ../../syllabus/IDEAS.md.
  NOT yet extracted: slidesI slides 32-42 (mixed strategies, N-player
  generalization) - confirmed by Jonathan on 2026-07-13 as a continuation of
  this topic, not yet run through the extraction pipeline. A further,
  separate "Topic 8b" (Game Theory II: extensive form, repeated games,
  oligopoly - slidesIIb ~15-80) is deliberately kept isolated rather than
  folded in here. See ../../TOPIC_PLAN.md.

  2026-07-15: Opera/Football and Fisherman's Dilemma originally recreated
  as plain Markdown tables, which silently dropped the original slides'
  hand-drawn best-response arrows and circled equilibrium (Jonathan caught
  this). Fixed by rendering the table+annotation as one image via the new
  tools/render_diagram.py (raw/media/diagrams/s014_diagram.png and
  s019_diagram.png, copied into media/ as opera-football-diagram.png and
  fishermans-dilemma-diagram.png). Also split the Nash-bio slide into two
  (Nash's own contribution vs. Nash in popular culture) to fix text
  overflow caused by the bg-image column, and fixed the Nash portrait
  being cropped by Marp's cover-fill default (needed explicit w: sizing,
  not fit:contain - see HANDOFF.md gotchas).

  2026-07-15 (same day, follow-up): extract_topic.py now auto-detects
  diagram candidates (table/picture + line/oval annotation shapes).
  Re-running it against this topic's slide range found a THIRD case that
  had shipped unnoticed: slide 15 (the revisited Prisoner's Dilemma table,
  "Example: The Prisoner's Dilemma" in deck.md) also has best-response
  arrows and a circled equilibrium as separate shapes - missed originally
  because slide 12's copy of the same table (no annotation there) had
  already been reviewed and nobody thought to check the second occurrence.
  Fixed the same way; see raw/diagram_candidates.json for all three cases'
  exact shape IDs. Default policy going forward: capture every detected
  candidate, full fidelity, by default - simplifying to a plain table is a
  deliberate per-slide exception now, not something that happens by
  default omission.
