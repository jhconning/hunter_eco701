      figures: elasticity-of-substitution.png, technical-progress.png,
      producer-surplus.png. Their notebook cells were run on their own, so
      those three cells have no stored output in the notebook.
    - Also 2026-10-05: "Euler's Theorem" added after "Returns to Scale"
      (F_KL > 0 is stated for constant returns only; it can fail under
      decreasing returns). "Short-Run Average and Marginal Cost" moved from
      Part II to Part III, just before "Supply: The Price-Taking Firm": in
      Part II students read its dashed long-run cost line as a price. The
      short run is explained there with an isoquant drawing on the board,
      leading into "The Long Run Is the Envelope".
    - Also 2026-10-05: Part II now ends with "The Envelope Theorem" (new;
      Topic 2 gave only the shadow-price form, so the general rule is
      stated here for the first time), "Shephard's Lemma" (moved from the
      end of Part III and given a proof from the first-order conditions,
      without the Lagrangian), and "Cost Minimization: Summary" (new).
      Hotelling's lemma is now a bullet on "Producer Surplus".
    - Also 2026-10-05: added "Properties of the Cost Function" (after
      Shephard; NS ch. 10 "Properties of cost functions", Figure 10.6),
      "The Profit Function and Its Properties" (after "A Wage Rise Hits
      Twice"; NS ch. 11 "Properties of the profit function", Example 11.4),
