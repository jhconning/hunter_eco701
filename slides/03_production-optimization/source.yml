  Very different content profile from Topic 2: only 40 top-level equations
  but 28 GROUP shapes / 82 AUTO_SHAPE / 22 FREEFORM - isoquant maps, cost
  curves, and the expansion path are native PowerPoint vector drawings, not
  Mathcad-rendered graphs or picture+annotation composites. extract_topic.py's
  diagram_candidates.json heuristic (built for TABLE/PICTURE + annotation)
  found zero candidates here - it's blind to this pattern entirely. Used
  the new tools/export_slide_pngs.py (added this session) to export every
  slide 162-202 as a full PNG unconditionally, then hand-picked crop
  regions per slide instead of relying on automatic diagram detection.

  A few slides (176) have professor-typed equations using lambda/partial
  symbols that didn't survive extract_topic.py's text extraction (rendered
  as blank "L/L = w - (F/L) = 0" instead of "dL/dL = w - lambda(dF/dL) = 0")
  - re-keyed by viewing the full-slide PNG directly rather than trusting the
  extracted text.

  Both sub-chunks done as of 2026-07-16, deck.md complete end to end (35
  slides): sub-chunk 1 (slides 162-186 - production function, MPP,
  isoquants, RTS, cost minimization via Lagrangian, derived demand,
  average/marginal cost, Cobb-Douglas cost function) and sub-chunk 2
  (slides 187-202 - CRS/DRS cases, AC/MC with fixed costs, the profit-max/
  cost-min duality, conditional vs. unconditional input demand, short-run
  vs. long-run costs, profit maximization and its FOC/SOC, average/
  marginal revenue).

  Three Mathcad-generated graphs found in the 187-202 range (CRS Cost
  Function, AC/MC flat line for CRS, DRS Cost Function) plus one rich
  Mathcad symbolic-solve-and-plot panel for the profit-maximization worked
  example (p(q)=10-q, etc.) - all confirmed genuine graphs/panels by
  viewing directly, not "(no result)" OCR failures.

  Recurring lesson from this topic's native-diagram slides: the original
  deck's title varies between 1-line and 2-line depending on title length,
  so a single fixed crop offset doesn't work across slides - several
  needed 2-3 rounds of increasing the top-crop margin (checked via
  rasterization each time) before the leftover title text was fully
  excluded. Also hit two horizontal equation overflows from cramming both
  a problem statement and its FOCs onto one display-math line - same
  "always rasterize and look" discipline as Topic 2, just a different
  overflow direction (horizontal, not vertical).

  PORTED TO QUARTO 2026-09-26. deck.qmd replaces the Marp deck.md (kept for
  now as the pre-port record). Changes made during the port:
    - Notation standardised: L = labor, K = capital, w = wage, r = rental
      rate, \mathcal{L} = Lagrangian. The Marp deck used L for both labor
      and the Lagrangian and alternated between r and v for the rental
      rate; RTS renamed MRTS to match Topic 2.
    - All 15 legacy PowerPoint slide crops in media/ replaced by 12 figures
      generated from formulas in
      notebooks/topic03_production_figures.ipynb -> figs/. Ten of the old
      crops were whole 2400x1350 slides, carrying their own titles and
      prose annotations.
    - Added, beyond the legacy content: an opening bridge slide mapping
      Topic 2's consumer problem onto the firm's; returns to scale defined
      in Part I; the increasing-returns case alongside CRS and DRS; the
      competitive supply curve and the shut-down condition; Shephard's
      lemma; a consumer/producer duality map; and the vocabulary and
      road-ahead closers used in Topics 1-2.
    - Topic 2's closing teaser was reworded in the same commit: it had
      promised consumer duality (expenditure minimisation, Roy's identity)
      for Topic 3, which the schedule assigns to production.
  Verified with tools/verify_deck.py: 45 pages, 0 flagged, spot-checked by
  eye. Still deploy: false pending review.

  REVISED 2026-10-05 after a review against Nicholson & Snyder 11e ch. 9-11
  (the assigned reading). This reverses one port decision above: the rental
  rate is now v, not r, matching the text (and freeing r for the interest
  rate in Topic 5). Also adopted from the text: C(v,w,q) argument order,
  "contingent" demand with L^c / K^c, SAC / SMC, "substitution and output
  effects", and its numbers. Parts II-III now carry one running example,
  the text's (q = sqrt(KL), w = 12, v = 3, q = 40 -> L = 20, K = 80,
  C = 12q, SC = 240 + 3q^2/20 at K_1 = 80; NS Examples 10.1, 10.5, 11.3,
  11.4), and Part III's market-power case is the sub shop of NS Example
  11.1. Kept from Topic 2 rather than the text: capital K, L and MRTS; a
  "Reading Alongside the Text" slide gives the translation. Grey "Text:"
  notes on slides point to NS figures and examples.
    - Slides must not assume consumer expenditure results (expenditure
      function, Hicksian/Marshallian demand): production is taught before
      consumption. Consumer parallels appear only as "next week" previews.
      The Duality Map was removed for this reason and parked in
