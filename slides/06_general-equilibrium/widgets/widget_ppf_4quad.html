<div id="fq-root">
  <style>
    #fq-root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13.5px;
      line-height: 1.35;
      color: #1c2430;
      background: #fdfdfb;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      box-sizing: border-box;
      display: flex;
      gap: 16px;
      align-items: stretch;
    }
    #fq-root * { box-sizing: border-box; }
    #fq-left {
      flex: 0 0 34%;
      min-width: 295px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #fq-right {
      flex: 1 1 66%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fq-card {
      background: #f7f6f2;
      border: 1px solid #e5e9f0;
      border-radius: 8px;
      padding: 11px 13px;
    }
    .fq-card-white {
      background: #ffffff;
      border: 1px solid #e5e9f0;
      border-radius: 8px;
      padding: 10px 13px;
      flex: 1;
    }
    .fq-slider-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .fq-label {
      font-weight: 600;
      color: #24325c;
      font-size: 13.5px;
    }
    .fq-val-badge {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 700;
      font-size: 14.5px;
      color: #b8842a;
      background: #fdfdfb;
      border: 1px solid #e5e9f0;
      border-radius: 4px;
      padding: 1px 7px;
    }
    #fq-lx-slider {
      width: 100%;
      accent-color: #b8842a;
      cursor: pointer;
      margin: 4px 0;
    }
    .fq-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #5a6578;
      margin-bottom: 8px;
    }
    .fq-btns {
      display: flex;
      gap: 8px;
    }
    .fq-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid #24325c;
      background: #ffffff;
      color: #24325c;
      transition: background 0.15s, color 0.15s;
    }
    .fq-btn:hover { background: #eef1f7; }
    .fq-btn-play {
      background: #24325c;
      color: #ffffff;
    }
    .fq-btn-play:hover { background: #1a2547; }
    .fq-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .fq-table td {
      padding: 4px 4px;
      border-bottom: 1px solid #eef1f6;
      text-align: left;
    }
    .fq-table td:last-child {
      text-align: right;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 600;
    }
    .fq-table tr:last-child td { border-bottom: none; }
    .fq-note {
      margin-top: 8px;
      font-size: 12px;
      color: #5a6578;
      line-height: 1.35;
    }
  </style>

  <div id="fq-left">
    <div class="fq-card">
      <div class="fq-slider-row">
        <span class="fq-label">Labor in good <i>x</i> (<i>l</i><sub>x</sub>)</span>
        <span class="fq-val-badge" id="fq-lx-val">36</span>
      </div>
      <input type="range" id="fq-lx-slider" min="0" max="100" step="1" value="36" />
      <div class="fq-ticks">
        <span>0 (all <i>y</i>)</span>
        <span>50</span>
        <span>100 (all <i>x</i>)</span>
      </div>
      <div class="fq-btns">
        <button type="button" class="fq-btn fq-btn-play" id="fq-btn-play">&#9654; Animate</button>
        <button type="button" class="fq-btn" id="fq-btn-e">E = (6, 8)</button>
      </div>
    </div>

    <div class="fq-card-white">
      <table class="fq-table">
        <tr><td>Labor in <i>x</i> (<i>l</i><sub>x</sub>)</td><td id="fq-r-lx" style="color:#a04434;">36</td></tr>
        <tr><td>Labor in <i>y</i> (<i>l</i><sub>y</sub> = 100 &minus; <i>l</i><sub>x</sub>)</td><td id="fq-r-ly" style="color:#2d6a4f;">64</td></tr>
        <tr><td>Output <i>x</i> = &radic;<i>l</i><sub>x</sub></td><td id="fq-r-x" style="color:#a04434;">6.00</td></tr>
        <tr><td>Output <i>y</i> = &radic;<i>l</i><sub>y</sub></td><td id="fq-r-y" style="color:#2d6a4f;">8.00</td></tr>
        <tr><td><i>RPT</i> = <i>x</i> / <i>y</i></td><td id="fq-r-rpt" style="color:#b8842a;">0.75</td></tr>
      </table>
      <div class="fq-note">
        <b>Four quadrants:</b><br>
        &bull; <b>Q1 (top-right):</b> PPF <i>x</i>&sup2; + <i>y</i>&sup2; = 100<br>
        &bull; <b>Q2 (top-left):</b> <i>y</i> = &radic;<i>l</i><sub>y</sub><br>
        &bull; <b>Q3 (bottom-left):</b> <i>l</i><sub>x</sub> + <i>l</i><sub>y</sub> = 100<br>
        &bull; <b>Q4 (bottom-right):</b> <i>x</i> = &radic;<i>l</i><sub>x</sub>
      </div>
    </div>
  </div>

  <div id="fq-right">
    <svg id="fq-svg" viewBox="0 0 540 430" style="width:100%; max-height:455px; background:#ffffff; border:1px solid #e5e9f0; border-radius:8px;">
      <!-- Gridlines will be added by JS -->
      <g id="fq-grid"></g>

      <!-- Main cross axes -->
      <line x1="50" y1="215" x2="495" y2="215" stroke="#24325c" stroke-width="1.8" />
      <line x1="270" y1="25" x2="270" y2="405" stroke="#24325c" stroke-width="1.8" />

      <!-- Axis labels -->
      <text x="502" y="219" font-size="13" font-weight="700" fill="#24325c">x</text>
      <text x="270" y="18" font-size="13" font-weight="700" fill="#24325c" text-anchor="middle">y</text>
      <text x="42" y="219" font-size="12.5" font-weight="700" fill="#2d6a4f" text-anchor="end">l<tspan dy="3" font-size="9.5">y</tspan></text>
      <text x="270" y="421" font-size="12.5" font-weight="700" fill="#a04434" text-anchor="middle">l<tspan dy="3" font-size="9.5">x</tspan></text>

      <!-- Quadrant titles -->
      <text x="478" y="40" font-size="11.5" font-weight="700" fill="#24325c" text-anchor="end">Q1: PPF (x² + y² = 100)</text>
      <text x="64" y="40" font-size="11.5" font-weight="700" fill="#2d6a4f">Q2: y = √l<tspan dy="2.5" font-size="8.5">y</tspan></text>
      <text x="64" y="395" font-size="11.5" font-weight="700" fill="#5a6578">Q3: l<tspan dy="2.5" font-size="8.5">x</tspan><tspan dy="-2.5"> + l</tspan><tspan dy="2.5" font-size="8.5">y</tspan><tspan dy="-2.5"> = 100</tspan></text>
      <text x="478" y="395" font-size="11.5" font-weight="700" fill="#a04434" text-anchor="end">Q4: x = √l<tspan dy="2.5" font-size="8.5">x</tspan></text>

      <!-- Curves -->
      <path id="fq-curve-q1" fill="none" stroke="#24325c" stroke-width="2.8" />
      <path id="fq-curve-q2" fill="none" stroke="#2d6a4f" stroke-width="2.5" />
      <line id="fq-line-q3" stroke="#5a6578" stroke-width="2.2" />
      <path id="fq-curve-q4" fill="none" stroke="#a04434" stroke-width="2.5" />

      <!-- Projection rectangle -->
      <polygon id="fq-proj-rect" fill="none" stroke="#b8842a" stroke-width="1.8" stroke-dasharray="5,4" />

      <!-- Tangent line at (x, y) in Q1 -->
      <line id="fq-tan-q1" stroke="#b8842a" stroke-width="2" stroke-dasharray="4,3" />

      <!-- Active points -->
      <circle id="fq-pt-q1" r="6" fill="#b8842a" stroke="#ffffff" stroke-width="1.6" />
      <circle id="fq-pt-q2" r="5" fill="#2d6a4f" stroke="#ffffff" stroke-width="1.5" />
      <circle id="fq-pt-q3" r="5" fill="#5a6578" stroke="#ffffff" stroke-width="1.5" />
      <circle id="fq-pt-q4" r="5" fill="#a04434" stroke="#ffffff" stroke-width="1.5" />

      <!-- Point label in Q1 -->
      <text id="fq-lbl-q1" font-size="11.5" font-weight="700" fill="#24325c"></text>
    </svg>
  </div>

  <script>
  (function () {
    const cx = 270, cy = 215;
    // Scale: x, y in [0, 10] -> 180px (18px/unit); lx, ly in [0, 100] -> 170px (1.7px/unit)
    const sOut = 18.0;
    const sLab = 1.70;

    function pxX(x) { return cx + x * sOut; }
    function pxY(y) { return cy - y * sOut; }
    function pxLy(ly) { return cx - ly * sLab; }
    function pxLx(lx) { return cy + lx * sLab; }

    // Draw subtle tick marks & grid
    const gridG = document.getElementById("fq-grid");
    const ns = "http://www.w3.org/2000/svg";
    function addLine(x1, y1, x2, y2, col, w) {
      const el = document.createElementNS(ns, "line");
      el.setAttribute("x1", x1); el.setAttribute("y1", y1);
      el.setAttribute("x2", x2); el.setAttribute("y2", y2);
      el.setAttribute("stroke", col); el.setAttribute("stroke-width", w || 1);
      gridG.appendChild(el);
    }
    function addText(x, y, txt, anchor) {
      const el = document.createElementNS(ns, "text");
      el.setAttribute("x", x); el.setAttribute("y", y);
      el.setAttribute("font-size", "9.5"); el.setAttribute("fill", "#5a6578");
      el.setAttribute("text-anchor", anchor || "middle");
      el.textContent = txt;
      gridG.appendChild(el);
    }

    for (let v = 5; v <= 10; v += 5) {
      addLine(pxX(v), cy - 185, pxX(v), cy + 175, "#eef1f6", 1);
      addLine(cx - 175, pxY(v), cx + 185, pxY(v), "#eef1f6", 1);
      addText(pxX(v), cy + 13, v, "middle");
      addText(cx - 7, pxY(v) + 3, v, "end");
    }
    for (let l = 50; l <= 100; l += 50) {
      addLine(pxLy(l), cy - 185, pxLy(l), cy + 175, "#eef1f6", 1);
      addLine(cx - 175, pxLx(l), cx + 185, pxLx(l), "#eef1f6", 1);
      addText(pxLy(l), cy + 13, l, "middle");
      addText(cx - 7, pxLx(l) + 3, l, "end");
    }

    // Static curves
    let d1 = "", d2 = "", d4 = "";
    for (let i = 0; i <= 100; i++) {
      const lx = i;
      const ly = 100 - lx;
      const x = Math.sqrt(lx);
      const y = Math.sqrt(ly);
      d1 += (i === 0 ? "M" : "L") + pxX(x).toFixed(1) + "," + pxY(y).toFixed(1) + " ";
      d2 += (i === 0 ? "M" : "L") + pxLy(lx).toFixed(1) + "," + pxY(Math.sqrt(lx)).toFixed(1) + " ";
      d4 += (i === 0 ? "M" : "L") + pxX(Math.sqrt(lx)).toFixed(1) + "," + pxLx(lx).toFixed(1) + " ";
    }
    document.getElementById("fq-curve-q1").setAttribute("d", d1);
    document.getElementById("fq-curve-q2").setAttribute("d", d2);
    document.getElementById("fq-curve-q4").setAttribute("d", d4);

    const l3 = document.getElementById("fq-line-q3");
    l3.setAttribute("x1", pxLy(100)); l3.setAttribute("y1", pxLx(0));
    l3.setAttribute("x2", pxLy(0));   l3.setAttribute("y2", pxLx(100));

    const slider = document.getElementById("fq-lx-slider");
    const btnPlay = document.getElementById("fq-btn-play");
    const btnE = document.getElementById("fq-btn-e");
    let animId = null;
    let dir = 1;

    function update() {
      const lx = parseFloat(slider.value);
      const ly = 100 - lx;
      const x = Math.sqrt(lx);
      const y = Math.sqrt(ly);

      document.getElementById("fq-lx-val").textContent = lx.toFixed(0);
      document.getElementById("fq-r-lx").textContent = lx.toFixed(0);
      document.getElementById("fq-r-ly").textContent = ly.toFixed(0);
      document.getElementById("fq-r-x").textContent = x.toFixed(2);
      document.getElementById("fq-r-y").textContent = y.toFixed(2);
      document.getElementById("fq-r-rpt").textContent = y > 0.05 ? (x / y).toFixed(2) : "∞";

      const X1 = pxX(x), Y1 = pxY(y);
      const X2 = pxLy(ly), Y3 = pxLx(lx);

      document.getElementById("fq-proj-rect").setAttribute(
        "points",
        `${X1.toFixed(1)},${Y1.toFixed(1)} ${X2.toFixed(1)},${Y1.toFixed(1)} ${X2.toFixed(1)},${Y3.toFixed(1)} ${X1.toFixed(1)},${Y3.toFixed(1)}`
      );

      document.getElementById("fq-pt-q1").setAttribute("cx", X1.toFixed(1));
      document.getElementById("fq-pt-q1").setAttribute("cy", Y1.toFixed(1));
      document.getElementById("fq-pt-q2").setAttribute("cx", X2.toFixed(1));
      document.getElementById("fq-pt-q2").setAttribute("cy", Y1.toFixed(1));
      document.getElementById("fq-pt-q3").setAttribute("cx", X2.toFixed(1));
      document.getElementById("fq-pt-q3").setAttribute("cy", Y3.toFixed(1));
      document.getElementById("fq-pt-q4").setAttribute("cx", X1.toFixed(1));
      document.getElementById("fq-pt-q4").setAttribute("cy", Y3.toFixed(1));

      // Tangent segment in Q1
      const tan = document.getElementById("fq-tan-q1");
      if (y > 0.4 && x > 0.4) {
        const slope = -x / y;
        const dx = 1.8 / Math.sqrt(1 + slope * slope);
        const dy = slope * dx;
        tan.setAttribute("x1", pxX(x - dx).toFixed(1));
        tan.setAttribute("y1", pxY(y - dy).toFixed(1));
        tan.setAttribute("x2", pxX(x + dx).toFixed(1));
        tan.setAttribute("y2", pxY(y + dy).toFixed(1));
        tan.setAttribute("visibility", "visible");
      } else {
        tan.setAttribute("visibility", "hidden");
      }

      const lbl = document.getElementById("fq-lbl-q1");
      lbl.textContent = `(${x.toFixed(1)}, ${y.toFixed(1)})`;
      lbl.setAttribute("x", (X1 + 8).toFixed(1));
      lbl.setAttribute("y", (Y1 - 8).toFixed(1));
    }

    function stopAnim() {
      if (animId) {
        clearInterval(animId);
        animId = null;
        btnPlay.innerHTML = "&#9654; Animate";
      }
    }

    btnPlay.addEventListener("click", function () {
      if (animId) {
        stopAnim();
      } else {
        btnPlay.innerHTML = "&#9646;&#9646; Pause";
        animId = setInterval(function () {
          let v = parseFloat(slider.value) + dir * 1;
          if (v >= 100) { v = 100; dir = -1; }
          else if (v <= 0) { v = 0; dir = 1; }
          slider.value = v;
          update();
        }, 45);
      }
    });

    slider.addEventListener("input", function () {
      stopAnim();
      update();
    });

    btnE.addEventListener("click", function () {
      stopAnim();
      slider.value = "36";
      update();
    });

    update();
  })();
  </script>
</div>
